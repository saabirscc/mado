<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MADO · Reel</title>
<meta name="theme-color" content="#F6F0E7">
<link rel="icon" href="../brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #F6F0E7; color: #171411; font: 500 16px/1.5 Poppins, system-ui, sans-serif; padding: 16px; }
  main { width: min(420px, 100%); display: grid; gap: 16px; }
  header { display: flex; align-items: center; gap: 12px; }
  header img { width: 40px; height: 40px; border-radius: 11px; }
  h1 { margin: 0; font: 400 2rem/1 Anton, Impact, sans-serif; text-transform: uppercase; letter-spacing: .02em; }
  h1 mark { background: linear-gradient(180deg, transparent 55%, #CDA544 55%, #CDA544 92%, transparent 92%); color: inherit; padding: 0 .06em; }
  .frame { position: relative; border-radius: 26px; overflow: hidden; background: #171411; aspect-ratio: 9 / 16; width: min(100%, calc(80svh * 9 / 16)); margin: 0 auto; box-shadow: 0 30px 80px -30px rgba(23,20,17,.45), 0 0 0 1px rgba(23,20,17,.06); }
  video { width: 100%; height: 100%; display: block; object-fit: contain; }
  .play { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(23,20,17,.12); border: 0; cursor: pointer; transition: opacity .3s; }
  .play i { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(180deg, #e2c77c, #CDA544 50%, #8A7650); box-shadow: 0 10px 40px -10px rgba(138,118,80,.8); }
  .play i::after { content: ""; margin-left: 6px; border-left: 24px solid #171411; border-top: 15px solid transparent; border-bottom: 15px solid transparent; }
  .playing .play { opacity: 0; pointer-events: none; }
  p { margin: 0; color: #6e6352; font-size: .9rem; text-align: center; }
  a { color: #8A7650; font-weight: 600; }
</style>
</head>
<body>
<main>
  <header><img src="../brand/app-icon.png" alt=""><h1>MADO · <mark>Reel</mark></h1></header>
  <div class="frame" id="frame">
    <video id="v" src="mado-reel.mp4" poster="reel-poster.jpg" playsinline preload="metadata"></video>
    <button class="play" id="p" type="button" aria-label="Play the reel with sound"><i></i></button>
  </div>
  <p>15 seconds, with sound: the website and the app. <a href="../previews/">Website</a> · <a href="../app/">App</a> · <a href="mado-reel.mp4" download>Download</a></p>
</main>
<script>
  const v = document.getElementById('v'), f = document.getElementById('frame');
  document.getElementById('p').addEventListener('click', () => { v.controls = true; v.play(); });
  v.addEventListener('play', () => f.classList.add('playing'));
  v.addEventListener('pause', () => f.classList.remove('playing'));
</script>
</body>
</html>
